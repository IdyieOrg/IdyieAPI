---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/database/schema":
    get:
      summary: Retrieves the database schema
      tags:
      - Database
      responses:
        '200':
          description: Schema successfully retrieved
  "/api/v1/database/query":
    get:
      summary: Executes a raw SQL query and returns the results
      tags:
      - Database
      parameters:
      - name: query
        in: query
        required: true
        description: SQL query to execute
        schema:
          type: string
      responses:
        '200':
          description: Query result returned
        '400':
          description: Missing query parameter
        '500':
          description: Error while executing the query
  "/api/v1/prompts":
    get:
      summary: Interprets a prompt and returns data
      tags:
      - Prompts
      parameters:
      - name: Authorization
        in: header
        required: true
        description: JWT token in the format Bearer <token>
        schema:
          type: string
      - name: prompt
        in: query
        required: true
        description: Instruction in natural language
        schema:
          type: string
      responses:
        '200':
          description: Prompt successfully processed
        '400':
          description: Missing prompt
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
