services:
  application:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.application
    container_name: idyie-api-application
    environment:
      IDYIE_FORMATTER_URL: $IDYIE_FORMATTER_URL
      IDYIE_LLM_URL: $IDYIE_LLM_URL
      PORT: $PORT
    networks:
      - idyie-network
    ports:
      - "$PORT:$PORT"
    stdin_open: true
    tty: true
    volumes:
      - .:/app

  mariadb:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.mariadb
    container_name: idyie-api-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
      MYSQL_USER: $MYSQL_USER
      MYSQL_PASSWORD: $MYSQL_PASSWORD
      MYSQL_DATABASE: $MYSQL_DATABASE
    networks:
      - idyie-network
    volumes:
      - idyie-api-mariadb:/var/lib/mysql

networks:
  default:
    driver: bridge
  idyie-network:
    external: true
    name: idyie-network

volumes:
  idyie-api-mariadb: